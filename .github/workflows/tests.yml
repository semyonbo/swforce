name: tests

on:
  push:
    paths-ignore: [README.md, CITATION.cff, LICENSE.md]
  pull_request:
    paths-ignore: [README.md, CITATION.cff, LICENSE.md]

concurrency:                     # a newer push cancels the run still going for this branch
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" pytest-cov
      - name: Test (adapters without their packages are skipped)
        run: python -m pytest -q --cov=swforce --cov-report=term-missing

  treams:
    name: treams adapter
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" treams
      - name: Test
        run: python -m pytest -q tests/test_adapter_treams.py

  smuthi:
    name: smuthi adapter
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # SMUTHI's pre-generated Cython C includes longintrepr.h, gone in 3.11
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y gfortran
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" smuthi
      - name: Test (fast part)
        run: python -m pytest -q -m "not slow" tests/test_adapter_smuthi.py
